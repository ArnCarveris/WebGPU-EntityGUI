<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity GUI Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@500;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030507;
            --panel: rgba(6, 12, 16, 0.84);
            --line: rgba(110, 220, 255, 0.28);
            --danger: #ff4a3d;
            --text: #d6e6ee;
            --muted: #7d95a3;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }
        canvas#view {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            cursor: crosshair;
        }
        /* Only used when WebGPU is unavailable; all other UI lives in the 3D scene */
        #fallback {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 16px;
        }
        #fallback.show { display: flex; }
        .card {
            max-width: 440px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-left: 3px solid var(--danger);
            padding: 14px 16px;
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
        }
        .tag { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--danger); }
        h1 { margin: 4px 0 2px; font-size: 24px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
        .desc { margin: 0 0 12px; font-size: 14px; line-height: 1.3; color: var(--muted); }
        #fallback pre {
            white-space: pre-wrap;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--danger);
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            margin: 10px 0 0;
            max-height: 40vh;
            overflow: auto;
        }
    </style>
</head>
<body>

    <div id="fallback">
        <div class="card">
            <div class="tag">SYSTEM FAULT</div>
            <h1>WebGPU unavailable</h1>
            <p class="desc">This demo needs WebGPU (Chrome/Edge 113+, or Brave with WebGPU enabled in brave://flags).</p>
            <pre id="error-message">navigator.gpu is undefined</pre>
        </div>
    </div>

    <canvas id="view"></canvas>

    <!-- Classic scripts (not ES modules) so the demo also runs when opened straight from disk -->
    <!-- core -->
    <script src="js/core/math.js"></script>
    <script src="js/core/audio.js"></script>
    <!-- rendering -->
    <script src="js/render/materials.js"></script>
    <script src="js/render/geometry.js"></script>
    <script src="js/render/shaders.js"></script>
    <script src="js/render/renderer.js"></script>
    <!-- GUI: EntityGUI and its subclasses -->
    <script src="js/gui/atlas.js"></script>
    <script src="js/gui/device-context.js"></script>
    <script src="js/gui/entity-gui.js"></script>
    <script src="js/gui/terminal-gui.js"></script>
    <script src="js/gui/easel-gui.js"></script>
    <script src="js/gui/phone-gui.js"></script>
    <script src="js/gui/phone-apps.js"></script>
    <!-- render-target systems -->
    <script src="js/systems/paint-canvas.js"></script>
    <script src="js/systems/cctv.js"></script>
    <script src="js/systems/media.js"></script>
    <script src="js/systems/iptv.js"></script>
    <!-- world -->
    <script src="js/world/entities.js"></script>
    <script src="js/world/world.js"></script>
    <!-- game -->
    <script src="js/game/player.js"></script>
    <script src="js/game/input.js"></script>
    <script src="js/game/interaction.js"></script>
    <script src="js/game/phone.js"></script>
    <script src="js/game/bindings.js"></script>
    <script src="js/game/game.js"></script>
    <!-- data + entry point -->
    <script src="js/scenario.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
